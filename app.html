<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>Vert Plan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column, bottom tab bar. Court-blue ink, signal orange reserved for form check. */
:root{--bg:#F2F4F6;--panel:#FFFFFF;--ink:#14212B;--muted:#55656F;--line:#C9D1D8;--fill:#E6EBEF;--btn:#14212B;--btn-ink:#FFFFFF;--accent:#C2410C;--accent-tint:#FDEDE4;--accent-ink:#8F3008;--focus:#1D5FD0;
--f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;--f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1620;--panel:#16222D;--ink:#E7EDF1;--muted:#9AABB8;--line:#33444F;--fill:#1F2D39;--btn:#E7EDF1;--btn-ink:#0E1620;--accent:#FF8A57;--accent-tint:#2D1E17;--accent-ink:#FFB08A;--focus:#7FB0FF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1620;--panel:#16222D;--ink:#E7EDF1;--muted:#9AABB8;--line:#33444F;--fill:#1F2D39;--btn:#E7EDF1;--btn-ink:#0E1620;--accent:#FF8A57;--accent-tint:#2D1E17;--accent-ink:#FFB08A;--focus:#7FB0FF;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
#app{max-width:480px;margin:0 auto;padding:20px 0 96px}
h1,h2{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1.05}
h1{font-size:34px}
h2{font-size:20px}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.eyebrow{font-size:13px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card.accent{border:2px solid var(--accent);background:var(--accent-tint)}
.card.dash{border:1.5px dashed var(--line);background:transparent}
.lbl{font-size:15px;font-weight:600;margin:0 0 8px}
button,.btn{font:inherit;cursor:pointer}
button:focus-visible,.btn:focus-visible,input:focus-visible,a:focus-visible,label:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border:0;border-radius:12px;background:var(--btn);color:var(--btn-ink);font-size:16px;font-weight:600;text-align:center;text-decoration:none;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.acc{background:var(--accent);color:#fff}
.btn.accl{background:var(--accent-tint);color:var(--accent-ink);border:1.5px solid var(--accent)}
.btn.sm{min-height:44px;width:auto;padding:0 14px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border:1.5px solid var(--line);border-radius:22px;background:var(--panel);color:var(--ink);font-size:15px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:grid;gap:0}
.seg button{min-height:44px;border:1.5px solid var(--line);border-left-width:0;background:var(--panel);color:var(--ink);font-size:14px;padding:0 6px}
.seg button:first-child{border-left-width:1.5px;border-radius:10px 0 0 10px}
.seg button:last-child{border-radius:0 10px 10px 0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.seg.a button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
fieldset{border:0;padding:0;margin:0}
legend{padding:0;font-size:15px;font-weight:600;margin-bottom:8px}
input[type=number]{min-height:44px;width:120px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;background:var(--panel);color:var(--ink)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{min-height:58px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.day small{font-size:11px;color:var(--muted)}
.day.prac{background:var(--fill);border-color:var(--ink)}
.day.prac small{color:var(--ink);font-weight:700}
.day.game{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day.game small{color:var(--bg);font-weight:700}
.row{display:flex;align-items:center;gap:12px;min-height:50px;padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.row.today{border:2px solid var(--ink)}
.row.mute{background:transparent;color:var(--muted)}
.row.prac{background:var(--fill)}
.row.game{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row .d{width:34px;font-weight:700;font-size:14px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:15px}
.row .t span{font-size:12px;color:var(--muted)}
.tag{font-size:12px;padding:3px 8px;border:1.5px solid var(--ink);border-radius:12px;white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tabs button{min-height:44px;border:1.5px solid var(--line);border-left-width:0;background:var(--panel);color:var(--ink);font-size:14px}
.tabs button:first-child{border-left-width:1.5px;border-radius:10px 0 0 10px}
.tabs button:last-child{border-radius:0 10px 10px 0}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.bar5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:6px}
.bar5 i{height:8px;border-radius:4px;background:var(--line)}
.bar5 i.on{background:var(--ink)}
.ex{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.ex input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--ink)}
.ex .t{flex:1;min-width:0}
.ex .t b{display:block;font-size:15px}
.ex .t span{font-size:13px;color:var(--muted)}
.ex a.demo{font-size:13px;color:var(--ink)}
.vid{position:relative;background:var(--fill);border:1px solid var(--line);border-radius:10px;overflow:hidden;aspect-ratio:3/4}
.vid video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.vid.you{border:2px solid var(--accent)}
.vid .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px;text-align:center;font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cap{font-size:13px;font-weight:600;text-align:center;margin-top:6px}
.cap span{font-weight:400;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--ink);min-height:44px}
nav.nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:0 max(0px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-right,0px));z-index:5}
nav.nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav.nav button{min-height:58px;border:0;border-top:3px solid transparent;background:none;color:var(--muted);font-size:13px}
nav.nav button[aria-current=page]{color:var(--ink);font-weight:700;border-top-color:var(--ink)}
.notice{border:1.5px solid var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;background:var(--panel)}
.err{color:var(--accent-ink);font-size:14px;font-weight:600}
.small{font-size:13px;color:var(--muted);line-height:1.45}
.cue{font-size:14px;line-height:1.45;margin-top:6px}
.week7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;font-size:12px}
.week7 div{border:1px solid var(--line);border-radius:8px;padding:6px 0;background:var(--panel)}
.week7 b{display:block;font-size:12px;margin-top:2px}
.lg{font-family:var(--f-display);font-size:30px;line-height:1}
.dots{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;margin-top:10px}
.dots i{height:14px;border-radius:3px;border:1.5px solid var(--line)}
.dots i.on{background:var(--ink);border-color:var(--ink)}
.right{display:flex;justify-content:space-between;align-items:center;gap:8px}
@media (prefers-reduced-motion:no-preference){.btn,.chip{transition:background .12s}}
</style>
</head>

/* ---------- dates ---------- */
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function mid(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);return x;}
function curWeek(){if(!S.start)return 1;var a=mid(new Date()),b=mid(new Date(S.start+'T00:00:00'));var n=Math.floor((a-b)/864e5);return Math.max(1,Math.min(4,Math.floor(n/7)+1));}
function planDone(){if(!S.start)return false;var a=mid(new Date()),b=mid(new Date(S.start+'T00:00:00'));return Math.floor((a-b)/864e5)>=28;}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* ---------- scheduler (draft rules: a coach or physical therapist should review) ---------- */
function buildWeek(sched){
 var t=[null,null,null,null,null,null,null],placed={},notes=[];
 var m=function(d){return ((d%7)+7)%7;};
 var game=function(d){return sched[m(d)]==='game';};
 var prac=function(d){return sched[m(d)]==='prac';};
 var pref={heavy:0,plyo:3,upper:5};
 var adj=function(a,b){var x=Math.abs(a-b);return x===1||x===6;};
 ['heavy','plyo','upper'].forEach(function(kind){
  var best=null;
  for(var d=0;d<7;d++){
   if(game(d)||t[d]!==null)continue;
   var ahead=kind==='upper'?0:2,bad=false;
   for(var i=1;i<=ahead;i++){if(game(d+i)){bad=true;}}
   if(bad)continue;
   var dist=Math.min((d-pref[kind]+7)%7,(pref[kind]-d+7)%7);
   var c=dist;
   if(prac(d))c+=kind==='upper'?2:4;
   if(kind==='plyo'&&placed.heavy!==undefined&&adj(d,placed.heavy))c+=6;
   if(kind==='heavy'&&placed.plyo!==undefined&&adj(d,placed.plyo))c+=6;
   if(kind==='heavy'&&game(d-1))c+=1;
   if(!best||c<best.c||(c===best.c&&dist<best.dist))best={d:d,c:c,dist:dist};
  }
  if(best){t[best.d]=kind;placed[kind]=best.d;}else{notes.push(kind);}
 });
 var pts=0;
 for(var d2=0;d2<7;d2++){
  if(sched[d2]==='game')pts+=2;
  if(sched[d2]==='prac')pts+=1;
  if(t[d2]==='heavy')pts+=1.5;
  if(t[d2]==='plyo')pts+=1;
  if(t[d2]==='upper')pts+=0.75;
 }
 var level=pts<6?'Light':(pts<=8.5?'Moderate':'High');
 return {t:t,notes:notes,pts:pts,level:level};
}
var TEST_SUNDAY_PLYO=true; // TEMPORARY for testing: Sunday is always the plyo day. Set to false to remove.
function kindFor(dow,week,isCurrent){
 if(TEST_SUNDAY_PLYO&&dow===0)return 'plyo';
 var w=buildWeek(S.sched),k=w.t[dow];
 if(k==='plyo'&&w.level==='High')k='plyoL';
 if(isCurrent&&k){
  var date=ymd(addDays(mid(new Date()),dow-new Date().getDay()));
  if((k==='plyo'||k==='plyoL')&&S.hold.plyo&&date<=S.hold.plyo)k='lite';
  if(k==='heavy'&&S.hold.heavy&&date<=S.hold.heavy)k='lite';
 }
 return k;
}
function exText(id,week){var e=EX[id];if(e.sets)return e.sets[week-1]+' sets '+e.d;return e.d;}

/* ---------- views ---------- */
function head(title,sub,eyebrow){return (eyebrow?'<div class="eyebrow">'+esc(eyebrow)+'</div>':'')+'<h1>'+esc(title)+'</h1>'+(sub?'<p class="sub">'+esc(sub)+'</p>':'');}
function dayGrid(sched){return '<div class="days">'+sched.map(function(s,i){return '<button type="button" class="day '+s+'" data-act="cycle" data-i="'+i+'" aria-label="'+FULL[i]+': '+(s==='off'?'off':s==='prac'?'practice':'game')+'">'+DAYS[i].slice(0,2)+'<small>'+(s==='off'?'off':s==='prac'?'prac':'game')+'</small></button>';}).join('')+'</div>';}
function chips(list,sel,act){return '<div class="chips">'+list.map(function(x){return '<button type="button" class="chip" data-act="'+act+'" data-v="'+esc(x)+'" aria-pressed="'+(sel.indexOf(x)>-1)+'">'+esc(x)+'</button>';}).join('')+'</div>';}
function seg(list,sel,act,cols,extra){return '<div class="seg '+(extra||'')+'" style="grid-template-columns:repeat('+cols+',minmax(0,1fr))" role="group">'+list.map(function(x){return '<button type="button" data-act="'+act+'" data-v="'+esc(x)+'" aria-pressed="'+(sel===x)+'">'+esc(x)+'</button>';}).join('')+'</div>';}

function streak(){
 if(!S.start)return 0;var b=mid(new Date(S.start+'T00:00:00')),cnt={};
 Object.keys(S.done).forEach(function(k){var n=Math.floor((mid(new Date(k+'T00:00:00'))-b)/864e5);if(n>=0){var w=Math.floor(n/7);cnt[w]=(cnt[w]||0)+1;}});
 var cur=Math.floor((mid(new Date())-b)/864e5/7),s=0;
 for(var w=cur;w>=0;w--){if((cnt[w]||0)>=2)s++;else if(w===cur)continue;else break;}
 return s;
}
function spark(){

/* ---------- lift log ---------- */
var LOGGABLE=['bsq','cdl','wsj','row','ohp'];
function liftLast(id,key){var a=(S.lifts[id]||[]).filter(function(x){return x.date!==key;});return a.length?a[a.length-1].lb:null;}
function liftToday(id,key){var a=(S.lifts[id]||[]).filter(function(x){return x.date===key;});return a.length?a[0].lb:'';}

function saveLift(id,val){
 var n=parseFloat(val),key=ymd(new Date()),a=S.lifts[id]||(S.lifts[id]=[]);
 S.lifts[id]=a=a.filter(function(x){return x.date!==key;});
 if(n>0&&n<=999)a.push({date:key,lb:n});
 a.sort(function(x,y){return x.date<y.date?-1:x.date>y.date?1:0;});

function saveAllLifts(){LOGGABLE.forEach(function(id){var el=document.getElementById('lw_'+id);if(el&&el.value!=='')saveLift(id,el.value);});}
function shortDate(s){return Number(s.slice(5,7))+'/'+Number(s.slice(8,10));}
function liftChart(a){
 var vals=a.map(function(x){return x.lb;}),mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),pad=mn===mx?5:(mx-mn)*0.15,lo=mn-pad,hi=mx+pad;
 function px(i){return a.length===1?164:44+i*(244/(a.length-1));}
 function py(v){return 14+(hi-v)/(hi-lo)*84;}
 var pts=a.map(function(x,i){return px(i).toFixed(1)+','+py(x.lb).toFixed(1);}).join(' '),o='';
 o+='<line x1="40" x2="292" y1="'+py(mn).toFixed(1)+'" y2="'+py(mn).toFixed(1)+'" stroke="var(--line)" stroke-dasharray="2 4"/><line x1="40" x2="292" y1="'+py(mx).toFixed(1)+'" y2="'+py(mx).toFixed(1)+'" stroke="var(--line)" stroke-dasharray="2 4"/>';
 o+='<text x="2" y="'+(py(mx)+4).toFixed(1)+'" font-size="11" fill="var(--muted)">'+mx+'</text>';
 if(mn!==mx)o+='<text x="2" y="'+(py(mn)+4).toFixed(1)+'" font-size="11" fill="var(--muted)">'+mn+'</text>';
 if(a.length>1)o+='<polyline points="'+pts+'" fill="none" stroke="var(--ink)" stroke-width="2.5"/>';
 a.forEach(function(x,i){o+='<circle cx="'+px(i).toFixed(1)+'" cy="'+py(x.lb).toFixed(1)+'" r="'+(i===a.length-1?5:3.5)+'" fill="var(--ink)"/>';});
 o+='<text x="40" y="122" font-size="11" fill="var(--muted)">'+shortDate(a[0].date)+'</text>';
 if(a.length>1)o+='<text x="292" y="122" font-size="11" text-anchor="end" fill="var(--muted)">'+shortDate(a[a.length-1].date)+'</text>';
 return '<svg viewBox="0 0 300 128" width="100%" role="img" aria-label="Heaviest set over time, from '+vals[0]+' to '+vals[vals.length-1]+' pounds">'+o+'</svg>';
}

/* ---------- rim touch test ---------- */
var RIM={top:158,k:7,min:88,max:156,vh:510};
function rimY(h){return 10+(RIM.top-h)*RIM.k;}
function clampTouch(h){return Math.max(RIM.min,Math.min(RIM.max,Math.round(h*2)/2));}
function fmtIn(i){var ft=Math.floor(i/12),r=Math.round((i-ft*12)*2)/2;if(r===12){ft++;r=0;}return ft+' ft '+r+' in';}
function setTouchFromY(cy){var sv=document.getElementById('rimsvg');if(!sv)return;var r=sv.getBoundingClientRect();var y=(cy-r.top)/r.height*RIM.vh;ui.touch=clampTouch(RIM.top-(y-10)/RIM.k);updateRim();}
function updateRim(){
 var y=rimY(ui.touch),l=document.getElementById('rl'),h=document.getElementById('rh'),t=document.getElementById('rt'),o=document.getElementById('rimout');
 if(!l)return;
 l.setAttribute('y1',y);l.setAttribute('y2',y);h.setAttribute('cy',y);t.setAttribute('y',y-10);t.textContent=fmtIn(ui.touch);
 if(o)o.innerHTML=rimOut();
}

}

 var front=ui.rimView==='Front view',o='',OR='#E8590C',cy=rimY(120),y=rimY(ui.touch);
 [96,108,120,132,144,156].forEach(function(h){o+='<line x1="34" x2="300" y1="'+rimY(h)+'" y2="'+rimY(h)+'" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><text x="2" y="'+(rimY(h)+4)+'" font-size="11" fill="var(--muted)">'+(h/12)+' ft</text>';});
 if(front){
  o+='<rect x="50" y="'+rimY(147)+'" width="200" height="'+(42*RIM.k)+'" rx="3" fill="var(--panel)" stroke="var(--muted)" stroke-width="2"/>'+

  '<rect x="138" y="'+(cy-13)+'" width="24" height="12" rx="2" fill="'+OR+'"/>'+
  '<ellipse cx="150" cy="'+cy+'" rx="25" ry="6" fill="none" stroke="'+OR+'" stroke-width="4"/>'+
  '<text x="54" y="'+(rimY(147)+14)+'" font-size="10" fill="var(--muted)">Top of backboard</text>'+
  '<text x="54" y="'+(rimY(105)-6)+'" font-size="10" fill="var(--muted)">Bottom of backboard</text>'+
  '<text x="180" y="'+(cy+4)+'" font-size="11" fill="var(--ink)">Rim</text>'+
  '<text x="166" y="'+(cy-6)+'" font-size="10" fill="var(--ink)">Bracket</text>';
 }else{
  o+='<rect x="70" y="'+rimY(147)+'" width="10" height="'+(42*RIM.k)+'" fill="var(--panel)" stroke="var(--muted)" stroke-width="2"/>'+
  '<polygon points="88,'+(cy+3)+' 182,'+(cy+3)+' 166,'+rimY(105)+' 104,'+rimY(105)+'" fill="none" stroke="var(--muted)" stroke-width="1" opacity=".7"/>'+
  '<rect x="80" y="'+cy+'" width="40" height="24" rx="2" fill="'+OR+'" opacity=".9"/>'+

 }
 o+='<line id="rl" x1="34" x2="300" y1="'+y+'" y2="'+y+'" stroke="var(--ink)" stroke-width="2.5"/><circle id="rh" cx="270" cy="'+y+'" r="11" fill="var(--ink)" stroke="var(--bg)" stroke-width="3"/><text id="rt" x="254" y="'+(y-10)+'" text-anchor="end" font-size="14" font-weight="700" fill="var(--ink)" stroke="var(--bg)" stroke-width="4" paint-order="stroke">'+fmtIn(ui.touch)+'</text>';

function reachCard(){
 var r=S.reach||0,ft=r?Math.floor(r/12):'',inn=r?(r-ft*12):'';
 return '<div class="stack" style="gap:10px"><div class="small">The rim test needs your standing reach. Measure it once with a tape: stand flat footed next to a wall, reach one arm straight up, mark your highest fingertip point on the wall, and measure from the floor to the mark.</div><div style="display:flex;gap:8px;align-items:center"><input id="rf" type="number" inputmode="numeric" min="5" max="10" placeholder="ft" value="'+ft+'" style="width:84px"><span>ft</span><input id="ri" type="number" inputmode="decimal" step="0.5" min="0" max="11.5" placeholder="in" value="'+inn+'" style="width:84px"><span>in</span></div>'+(ui.reachErr?'<div class="err" role="alert">'+esc(ui.reachErr)+'</div>':'')+'<button type="button" class="btn" data-act="savereach">Save standing reach</button></div>';
}
function viewRim(){
 if(!S.reach||ui.editReach)return reachCard();
 return '<div class="stack" style="gap:10px"><div class="right small"><span>Standing reach: <b>'+fmtIn(S.reach)+'</b></span><button type="button" class="btn ghost sm" data-act="editreach">Edit</button></div>'+
 seg(['Front view','Side view'],ui.rimView,'rview',2)+
 '<div class="small">Jump, touch the highest point you can, then place the marker where your hand touched. Drag on the right side, tap the diagram, or use the buttons. Side view is for when you approach from the side and touch the rim bracket. Standard indoor rim, 10 ft. The diagram is approximate.</div>'+
 '<div style="position:relative">'+rimSvg()+'<div id="rimdrag" style="position:absolute;top:0;right:0;bottom:0;width:30%;touch-action:none;cursor:ns-resize"></div></div>'+
 '<div style="display:flex;gap:8px"><button type="button" class="btn ghost sm" style="flex:1" data-act="nudge" data-v="-1">Down 1 in</button><button type="button" class="btn ghost sm" style="flex:1" data-act="nudge" data-v="1">Up 1 in</button></div>'+
 '<div id="rimout">'+rimOut()+'</div></div>';
}
function viewProgress(){
 var n=Object.keys(S.done).length,dots=[];for(var i=0;i<12;i++)dots.push('<i class="'+(i<n?'on':'')+'"></i>');
 var t=S.tests,first=t.length?t[0].in:null,now=t.length?t[t.length-1].in:null;
 var days=[];for(var k=6;k>=0;k--){var d=addDays(mid(new Date()),-k),key=ymd(d),pn=null;S.pain.forEach(function(p){if(p.date===key)pn=p;});days.push('<div>'+DAYS[d.getDay()].slice(0,2)+'<b>'+(pn?({fine:'Fine',tired:'Tired',achy:'Achy',sharp:'Sharp'}[pn.status]):'-')+'</b></div>');}
 var checks=S.checks.slice(-4).reverse().map(function(c){return '<div class="row"><div class="t"><b>'+esc(EX[c.ex].name)+'</b><span>'+esc(c.date)+' · '+(c.flags.length?esc(c.flags.map(function(x){return x.short;}).join(', ')):'No flags')+'</span></div><button type="button" class="btn ghost sm" data-act="checkform" data-v="'+c.ex+'">Re-check</button></div>';}).join('');
 return '<div class="stack">'+head('Progress','Week '+curWeek()+' of 4')+
 '<div class="card"><div class="right"><b>Sessions done</b><span>'+n+' of 12</span></div><div class="dots" aria-hidden="true">'+dots.join('')+'</div><div class="small" style="margin-top:6px">Streak: '+streak()+' week'+(streak()===1?'':'s')+' in a row with 2 or more sessions.</div></div>'+
 '<div class="card"><div class="right"><b>Standing vertical</b></div>'+spark()+'<div class="right small"><span>Start '+(first!==null?first+' in':'--')+'</span><span>Now '+(now!==null?now+' in':'--')+'</span></div>'+
 '<div class="lbl" style="margin-top:14px">Log a test</div>'+seg(['Tape measure','Rim touch test'],ui.method,'method',2)+'<div style="margin-top:10px">'+(ui.method==='Tape measure'?'<div class="small" style="margin-bottom:8px">Enter how far your touch is above your standing reach.</div><div style="display:flex;gap:8px;align-items:center"><label for="vt" class="small">Inches</label><input id="vt" type="number" inputmode="decimal" step="0.5" min="1" max="60" placeholder="e.g. 22"><button type="button" class="btn sm" data-act="logtest">Log a test</button></div>':viewRim())+'</div></div>'+
 viewLifts()+'<div class="card accent"><div class="lbl" style="color:var(--accent-ink)">Form checks</div>'+(checks?'<div class="stack" style="gap:6px">'+checks+'</div>':'<div class="small" style="color:var(--ink)">None yet. Tap Check form on a workout to film your first set.</div>')+'</div>'+
 '<div class="card"><div class="lbl">Body check-ins, last 7 days</div><div class="week7">'+days.join('')+'</div><div class="small" style="margin-top:8px">Aches show here so you can spot a pattern.</div></div>'+
 sendCard()+
 '<button type="button" class="btn ghost" data-act="reset">'+(ui.confirmReset?'Tap again to erase everything':'Start over')+'</button></div>';
}

/* ---------- render ---------- */
function render(){
 var app=document.getElementById('app'),nav=document.getElementById('nav');
 if(!S.profile){app.innerHTML=viewIntake();nav.parentNode.hidden=true;return;}
 nav.parentNode.hidden=false;
 var v={plan:viewPlan,today:viewToday,form:viewForm,progress:viewProgress,checkin:viewCheckin}[ui.tab]();
 app.innerHTML=v;
 var tabs=[['plan','Plan'],['today','Today'],['form','Form check'],['progress','Progress']];
 nav.innerHTML=tabs.map(function(t){return '<button type="button" data-act="tab" data-v="'+t[0]+'" '+((ui.tab===t[0]||(ui.tab==='checkin'&&t[0]==='today'))?'aria-current="page"':'')+'>'+t[1]+'</button>';}).join('');
 if(ui.tab==='form'&&ui.fc.view==='compare')wireCompare();
}
function go(tab){ui.tab=tab;ui.notice=ui.tab==='plan'||ui.tab==='today'?ui.notice:'';ui.confirmReset=false;render();window.scrollTo(0,0);}

function wireCompare(){
 var vy=document.getElementById('vYou'),vr=document.getElementById('vRef');if(!vy)return;
 if(youUrl)vy.src=youUrl;
 var ru=refUrls[ui.fc.ex]||REFS[ui.fc.ex];if(ru){vr.src=ru;document.getElementById('refPh').hidden=true;}
 var pp=document.getElementById('pp'),sc=document.getElementById('scrub'),sp=document.getElementById('spd');
 var vids=function(){return ru?[vy,vr]:[vy];};
 pp.onclick=function(){var playing=!vy.paused;vids().forEach(function(v){if(playing)v.pause();else v.play().catch(function(){});});pp.textContent=playing?'Play':'Pause';};
 vy.ontimeupdate=function(){if(vy.duration)sc.value=Math.round(vy.currentTime/vy.duration*1000);};
 vy.onended=function(){pp.textContent='Play';};
 sc.oninput=function(){vids().forEach(function(v){if(v.duration){v.pause();v.currentTime=sc.value/1000*v.duration;}});pp.textContent='Play';};
 var rates=[1,0.5,0.25],ri=0;
 sp.onclick=function(){ri=(ri+1)%rates.length;vids().forEach(function(v){v.playbackRate=rates[ri];});sp.textContent=rates[ri]+'x';};
}

/* ---------- events ---------- */
function toggle(arr,v,excl){var i=arr.indexOf(v);if(v===excl)return [v];arr=arr.filter(function(x){return x!==excl;});if(i>-1&&v!==excl)arr=arr.filter(function(x){return x!==v;});else arr.push(v);return arr.length?arr:(excl?[excl]:arr);}
document.addEventListener('click',function(ev){
 if(ev.target.closest&&ev.target.closest('#rimsvg')){setTouchFromY(ev.clientY);return;}
 var b=ev.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;
 var a=b.getAttribute('data-act'),v=b.getAttribute('data-v'),i=Number(b.getAttribute('data-i'));
 var d=ui.draft,f=ui.fc;
 if(a==='tab'){if(v==='form'&&ui.fc.view!=='pick'&&ui.fc.view!=='result'){ui.fc.view='pick';}go(v);return;}
 if(a==='sport'){d.sport=v;render();return;}
 if(a==='exp'){d.exp=v;render();return;}
 if(a==='sore'){d.sore=toggle(d.sore,v,'Nothing');render();return;}
 if(a==='team'){d.teams=toggle(d.teams,v,'None');render();return;}
 if(a==='method'){ui.method=v;render();return;}
 if(a==='lift'){ui.liftSel=v;render();return;}
 if(a==='dellift'){var la=S.lifts[ui.liftSel||'bsq'];if(la&&la.length){la.pop();save();}render();return;}
 if(a==='rview'){ui.rimView=v;render();return;}
 if(a==='nudge'){ui.touch=clampTouch(ui.touch+Number(v));updateRim();return;}
 if(a==='editreach'){ui.editReach=true;ui.reachErr='';render();return;}
 if(a==='savereach'){var rr=(parseFloat(document.getElementById('rf').value)||0)*12+(parseFloat(document.getElementById('ri').value)||0);if(rr<60||rr>120){ui.reachErr='Enter a reach between 5 ft and 10 ft.';render();return;}S.reach=rr;ui.editReach=false;ui.reachErr='';save();render();return;}
 if(a==='logrim'){var vv=ui.touch-(S.reach||0);if(!S.reach||vv<=0||vv>60)return;S.tests.push({date:ymd(new Date()),in:vv,method:'rim',touch:ui.touch});save();render();return;}
 if(a==='cycle'){var tgt=S.profile?S.sched:d.sched,o=['off','prac','game'];tgt[i]=o[(o.indexOf(tgt[i])+1)%3];render();return;}
 if(a==='start'){
  var age=Number(d.age);
  if(!d.age||age<10||age>99){ui.err='Enter your age to continue.';render();return;}
  if(age<18&&!d.consent){ui.err='A parent or guardian needs to say it is OK before you start.';render();return;}
  var reach=null;
  if(d.rf!==''||d.ri!==''){var rr0=(parseFloat(d.rf)||0)*12+(parseFloat(d.ri)||0);if(rr0<60||rr0>120){ui.err='Check your standing reach (between 5 ft and 10 ft), or leave it blank for now.';render();return;}reach=rr0;}
  ui.err='';S.reach=reach;S.profile={sport:d.sport,exp:d.exp,teams:d.teams,sore:d.sore,minor:age<18};S.sched=d.sched.slice();S.start=ymd(new Date());
  if(d.sore.indexOf('Nothing')<0)S.hold.plyo=ymd(addDays(new Date(),6));
  save();ui.tab='plan';ui.notice=d.sore.indexOf('Nothing')<0?'You listed something sore, so jump work is low-impact for your first week.':'';render();window.scrollTo(0,0);return;
 }
 if(a==='week'){ui.week=Number(v);render();return;}
 if(a==='editdays'){ui.editDays=true;render();return;}
 if(a==='savedays'){ui.editDays=false;save();ui.notice='Plan updated for your new days.';render();return;}
 if(a==='finish'){saveAllLifts();var key=ymd(new Date()),k=kindFor(new Date().getDay(),curWeek(),true),list=(ui.todayEx&&ui.todayEx.key===key)?ui.todayEx.list:[];S.done[key]={kind:k,ex:list};save();ui.pain={status:null,where:[],effort:null};go('checkin');return;}
 if(a==='gocheckin'){ui.pain={status:null,where:[],effort:null};go('checkin');return;}
 if(a==='checkform'){ui.fc={ex:v,view:'record',answers:[],last:null};ui.tab='form';render();window.scrollTo(0,0);return;}
 if(a==='fcback'){ui.fc.view=ui.fc.view==='compare'?'record':'pick';render();return;}
 if(a.indexOf('ans')===0&&a!=='ans'){var qi=Number(a.slice(3));f.answers[qi]=v;document.getElementById('qs').innerHTML=qsHtml(EX[f.ex].check,f.answers);var all=f.answers.length===EX[f.ex].check.length&&f.answers.every(Boolean);var sb=document.querySelector('[data-act=savecheck]');if(sb)sb.disabled=!all;return;}
 if(a==='savecheck'){
  var qs=EX[f.ex].check,flags=[],good=[],seen={};
  qs.forEach(function(q,j){if(f.answers[j]===q.bad){if(!seen[q.flag]){seen[q.flag]=1;flags.push({flag:q.flag,label:q.q.replace(/^Did /,'').replace(/\?$/,'').replace(/^your /,'Your '),short:q.flag});}}else if(f.answers[j]&&f.answers[j]!=='Not sure')good.push(q.q.replace(/^Did /,'').replace(/^Was /,'').replace(/\?$/,''));});
  var fl2=flags.map(function(x){var q=qs.filter(function(z){return z.flag===x.flag;})[0];return {flag:x.flag,short:x.flag,label:{knee:'Knees caved',heel:'Heels came up',chest:'Chest dropped',loud:'Landing was loud',balance:'Landing was wobbly',uneven:'Feet landed unevenly'}[x.flag]||q.q};});
  var rec={id:String(Date.now()),ex:f.ex,date:ymd(new Date()),flags:fl2,answers:f.answers.slice()};
  S.checks.push(rec);S.clips=(S.clips||0)+1;
  f.last={flags:fl2,good:good.map(function(g){return g.charAt(0).toUpperCase()+g.slice(1);})};f.view='result';save();render();window.scrollTo(0,0);return;
 }
 if(a==='recheck'){if(S.recheck[f.ex])delete S.recheck[f.ex];else S.recheck[f.ex]=ymd(addDays(new Date(),3));save();render();return;}
 if(a==='auto'){S.poll.auto=v;save();render();return;}
 if(a==='waitlist'){S.poll.waitlist=!S.poll.waitlist;save();render();return;}
 if(a==='fcdone'){ui.fc={ex:null,view:'pick',answers:[],last:null};go('progress');return;}
 if(a==='copy'){var txt=summary();var done=function(){ui.copied=true;render();setTimeout(function(){ui.copied=false;render();},1800);};try{navigator.clipboard.writeText(txt).then(done,function(){window.prompt&&0;fallbackCopy(txt);done();});}catch(e){fallbackCopy(txt);done();}return;}
 if(a==='status'){ui.pain.status=v;render();return;}
 if(a==='where'){ui.pain.where=toggle(ui.pain.where,v,null);render();return;}
 if(a==='effort'){ui.pain.effort=v;render();return;}
 if(a==='savepain'){
  var p=ui.pain;S.pain.push({date:ymd(new Date()),status:p.status,where:p.where.slice(),effort:Number(p.effort)});
  var until=ymd(addDays(new Date(),6));
  if(p.status==='achy'||p.status==='sharp'){S.hold.plyo=until;}
  if(p.status==='sharp'){S.hold.heavy=until;}
  save();ui.notice=p.status==='sharp'?'Saved. Jumping and heavy lifting are out for the next week. Talk to a coach, parent or doctor.':p.status==='achy'?'Saved. Jumping is low-impact for the next week.':'Saved. See you next session.';go('plan');return;
 }
 if(a==='logtest'){var el=document.getElementById('vt'),n=parseFloat(el.value);if(!n||n<1||n>60)return;S.tests.push({date:ymd(new Date()),in:n});save();render();return;}
 if(a==='reset'){if(!ui.confirmReset){ui.confirmReset=true;render();return;}try{localStorage.removeItem(KEY);}catch(e){}S=def();ui.draft=newDraft();ui.confirmReset=false;ui.tab='plan';ui.week=null;render();window.scrollTo(0,0);return;}
});
function fallbackCopy(t){var x=document.createElement('textarea');x.value=t;x.style.position='fixed';x.style.opacity='0';document.body.appendChild(x);x.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(x);}
document.addEventListener('change',function(ev){
 var t=ev.target;
 if(t.id==='age'){var was=ui.draft.age!==''&&Number(ui.draft.age)<18;ui.draft.age=t.value;var now=t.value!==''&&Number(t.value)<18;if(was!==now)render();return;}
 if(t.id==='consent'){ui.draft.consent=t.checked;return;}
 if(t.getAttribute&&t.getAttribute('data-lift')){saveLift(t.getAttribute('data-lift'),t.value);return;}
 if(t.getAttribute&&t.getAttribute('data-act')==='toggleex'){
  var key=ymd(new Date());if(!ui.todayEx||ui.todayEx.key!==key)ui.todayEx={key:key,list:[]};
  var id=t.getAttribute('data-v'),l=ui.todayEx.list,ix=l.indexOf(id);if(t.checked&&ix<0)l.push(id);if(!t.checked&&ix>-1)l.splice(ix,1);return;
 }
 if(t.id==='clip'||t.id==='clip2'){var file=t.files&&t.files[0];if(!file)return;if(youUrl)URL.revokeObjectURL(youUrl);youUrl=URL.createObjectURL(file);S.clips=S.clips||0;ui.fc.view='compare';ui.fc.answers=[];render();window.scrollTo(0,0);return;}
 if(t.id==='refIn'){var rf=t.files&&t.files[0];if(!rf)return;if(refUrls[ui.fc.ex])URL.revokeObjectURL(refUrls[ui.fc.ex]);refUrls[ui.fc.ex]=URL.createObjectURL(rf);render();return;}
});
document.addEventListener('input',function(ev){var id=ev.target.id;if(id==='age')ui.draft.age=ev.target.value;if(id==='irf')ui.draft.rf=ev.target.value;if(id==='iri')ui.draft.ri=ev.target.value;});
var dragging=false;
document.addEventListener('pointerdown',function(ev){var dz=ev.target.closest&&ev.target.closest('#rimdrag');if(!dz)return;dragging=true;try{dz.setPointerCapture(ev.pointerId);}catch(e){}setTouchFromY(ev.clientY);ev.preventDefault();});
document.addEventListener('pointermove',function(ev){if(dragging)setTouchFromY(ev.clientY);});
document.addEventListener('pointerup',function(){dragging=false;});
document.addEventListener('pointercancel',function(){dragging=false;});
function newDraft(){return {sport:'Volleyball',age:'',consent:false,exp:'Beginner',rf:'',ri:'',teams:['None'],sore:['Nothing'],sched:['off','off','off','off','off','off','off']};}
ui.draft=newDraft();
render();
})();
</script>
