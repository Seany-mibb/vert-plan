<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>Vert Plan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column, bottom tab bar. Court-blue ink, signal orange reserved for form check. */
:root{--bg:#F2F4F6;--panel:#FFFFFF;--ink:#14212B;--muted:#55656F;--line:#C9D1D8;--fill:#E6EBEF;--btn:#14212B;--btn-ink:#FFFFFF;--accent:#C2410C;--accent-tint:#FDEDE4;--accent-ink:#8F3008;--focus:#1D5FD0;
--f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;--f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1620;--panel:#16222D;--ink:#E7EDF1;--muted:#9AABB8;--line:#33444F;--fill:#1F2D39;--btn:#E7EDF1;--btn-ink:#0E1620;--accent:#FF8A57;--accent-tint:#2D1E17;--accent-ink:#FFB08A;--focus:#7FB0FF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1620;--panel:#16222D;--ink:#E7EDF1;--muted:#9AABB8;--line:#33444F;--fill:#1F2D39;--btn:#E7EDF1;--btn-ink:#0E1620;--accent:#FF8A57;--accent-tint:#2D1E17;--accent-ink:#FFB08A;--focus:#7FB0FF;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
#app{max-width:480px;margin:0 auto;padding:20px 0 96px}
h1,h2{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1.05}
h1{font-size:34px}
h2{font-size:20px}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.eyebrow{font-size:13px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card.accent{border:2px solid var(--accent);background:var(--accent-tint)}
.card.dash{border:1.5px dashed var(--line);background:transparent}
.lbl{font-size:15px;font-weight:600;margin:0 0 8px}
button,.btn{font:inherit;cursor:pointer}
button:focus-visible,.btn:focus-visible,input:focus-visible,a:focus-visible,label:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border:0;border-radius:12px;background:var(--btn);color:var(--btn-ink);font-size:16px;font-weight:600;text-align:center;text-decoration:none;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.acc{background:var(--accent);color:#fff}
.btn.accl{background:var(--accent-tint);color:var(--accent-ink);border:1.5px solid var(--accent)}
.btn.sm{min-height:44px;width:auto;padding:0 14px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border:1.5px solid var(--line);border-radius:22px;background:var(--panel);color:var(--ink);font-size:15px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:grid;gap:0}
.seg button{min-height:44px;border:1.5px solid var(--line);border-left-width:0;background:var(--panel);color:var(--ink);font-size:14px;padding:0 6px}
.seg button:first-child{border-left-width:1.5px;border-radius:10px 0 0 10px}
.seg button:last-child{border-radius:0 10px 10px 0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.seg.a button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
fieldset{border:0;padding:0;margin:0}
legend{padding:0;font-size:15px;font-weight:600;margin-bottom:8px}
input[type=number]{min-height:44px;width:120px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;background:var(--panel);color:var(--ink)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{min-height:58px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.day small{font-size:11px;color:var(--muted)}
.day.prac{background:var(--fill);border-color:var(--ink)}
.day.prac small{color:var(--ink);font-weight:700}
.day.game{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day.game small{color:var(--bg);font-weight:700}
.row{display:flex;align-items:center;gap:12px;min-height:50px;padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.row.today{border:2px solid var(--ink)}
.row.mute{background:transparent;color:var(--muted)}
.row.prac{background:var(--fill)}
.row.game{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row .d{width:34px;font-weight:700;font-size:14px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:15px}
.row .t span{font-size:12px;color:var(--muted)}
.tag{font-size:12px;padding:3px 8px;border:1.5px solid var(--ink);border-radius:12px;white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tabs button{min-height:44px;border:1.5px solid var(--line);border-left-width:0;background:var(--panel);color:var(--ink);font-size:14px}
.tabs button:first-child{border-left-width:1.5px;border-radius:10px 0 0 10px}
.tabs button:last-child{border-radius:0 10px 10px 0}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.bar5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:6px}
.bar5 i{height:8px;border-radius:4px;background:var(--line)}
.bar5 i.on{background:var(--ink)}
.ex{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.ex input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--ink)}
.ex .t{flex:1;min-width:0}
.ex .t b{display:block;font-size:15px}
.ex .t span{font-size:13px;color:var(--muted)}
.ex a.demo{font-size:13px;color:var(--ink)}
.vid{position:relative;background:var(--fill);border:1px solid var(--line);border-radius:10px;overflow:hidden;aspect-ratio:3/4}
.vid video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.vid.you{border:2px solid var(--accent)}
.vid .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px;text-align:center;font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cap{font-size:13px;font-weight:600;text-align:center;margin-top:6px}
.cap span{font-weight:400;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--ink);min-height:44px}
nav.nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:0 max(0px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-right,0px));z-index:5}
nav.nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav.nav button{min-height:58px;border:0;border-top:3px solid transparent;background:none;color:var(--muted);font-size:13px}
nav.nav button[aria-current=page]{color:var(--ink);font-weight:700;border-top-color:var(--ink)}
.notice{border:1.5px solid var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;background:var(--panel)}
.err{color:var(--accent-ink);font-size:14px;font-weight:600}
.small{font-size:13px;color:var(--muted);line-height:1.45}
.cue{font-size:14px;line-height:1.45;margin-top:6px}
.week7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;font-size:12px}
.week7 div{border:1px solid var(--line);border-radius:8px;padding:6px 0;background:var(--panel)}
.week7 b{display:block;font-size:12px;margin-top:2px}
.lg{font-family:var(--f-display);font-size:30px;line-height:1}
.dots{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;margin-top:10px}
.dots i{height:14px;border-radius:3px;border:1.5px solid var(--line)}
.dots i.on{background:var(--ink);border-color:var(--ink)}
.right{display:flex;justify-content:space-between;align-items:center;gap:8px}
@media (prefers-reduced-motion:no-preference){.btn,.chip{transition:background .12s}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav" aria-label="Main"><div class="in" id="nav"></div></nav>
<script>
(function(){
'use strict';
// Paste a Google Form (or any feedback) link here to show it on the result screen.
var FEEDBACK_URL='';
var KEY='vertplan.v1';
var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var FULL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

/* ---------- content ---------- */
var CUES={
 knee:'Push your knees out over your toes as you stand up. Use a lighter weight until it holds.',
 heel:'Keep your whole foot on the floor. A slightly wider stance can help.',
 chest:'Keep your chest up and eyes forward. Lower the weight until you can hold it.',
 loud:'Land softly through your whole foot and bend your hips and knees. Quiet landings first, height later.',
 uneven:'Land on both feet at the same time and hold the landing for one second.',
 balance:'Slow the jump down and stick the landing before you add height.'
};
var QS_SQ=[{q:'Did your knees cave in?',bad:'Yes',flag:'knee'},{q:'Did your heels stay down?',bad:'No',flag:'heel'},{q:'Did your chest stay up?',bad:'No',flag:'chest'}];
var QS_LAND=[{q:'Did your knees cave in on landing?',bad:'Yes',flag:'knee'},{q:'Was your landing quiet?',bad:'No',flag:'loud'},{q:'Did both feet land together?',bad:'No',flag:'uneven'}];
var EX={
 prep:{name:'Warm-up and ankle prep',d:'7 min · ankle and knee stability',q:'ankle stability warm up volleyball'},
 bsq:{name:'Box squat',d:'4 sets of 5 · heavy',check:QS_SQ,q:'box squat form'},
 cdl:{name:'Conventional deadlift',d:'4 sets of 5 · lighter than the squats',q:'conventional deadlift form'},
 sprint:{name:'Sprints',d:'4 sets of 40 to 50 m',q:'sprint technique for jumping'},
 wsj:{name:'Weighted squat jumps',d:'4 sets of 5 to 8 · soft landing',check:QS_LAND,q:'weighted squat jumps technique'},
 ktj:{name:'Knees to jump',d:'4 sets of 5 to 8',q:'knees to jump exercise technique'},
 sls:{name:'Single leg step up jumps',d:'4 sets of 8',q:'single leg step up jump technique'},
 bound:{name:'Bounds',d:'3 sets of 20 m',q:'bounding exercise technique'},
 depth:{name:'Depth jumps',d:'3 sets of 5 · soft landing',check:QS_LAND,q:'depth jump technique'},
 wpogo:{name:'Weighted pogos',d:'3 sets of 10 · last set with no weight',q:'weighted pogo jumps'},
 gsq:{name:'Goblet squat',sets:[3,4,4,3],d:'of 5',check:QS_SQ,q:'goblet squat form'},
 rdl:{name:'Romanian deadlift',d:'3 sets of 8',q:'romanian deadlift form'},
 spl:{name:'Split squat',d:'3 sets of 8 each leg',q:'split squat form'},
 calf:{name:'Calf raise',d:'3 sets of 12',q:'calf raise form'},
 land:{name:'Block landing practice',d:'3 sets of 5 · soft landing',check:QS_LAND,q:'volleyball block jump landing technique'},
 foot:{name:'Footwork ladder',d:'3 rounds of 30 seconds',q:'volleyball footwork ladder drills'},
 pogo:{name:'Pogo jumps',d:'4 sets of 8 · 2 small, 1 high',q:'pogo jumps technique'},
 appr:{name:'Approach jumps',d:'4 sets of 5 to 8',check:QS_LAND,q:'approach jump technique vertical'},
 blk:{name:'Block jump',d:'3 sets of 5 · soft landing',check:QS_LAND,q:'volleyball block jump technique'},
 pu:{name:'Push-up',d:'3 sets of 10',q:'push up form'},
 row:{name:'Dumbbell row',d:'3 sets of 10 each arm',q:'dumbbell row form'},
 ohp:{name:'Shoulder press',d:'3 sets of 8',q:'dumbbell shoulder press form'},
 plank:{name:'Plank',d:'3 sets of 30 seconds',q:'plank form'},
 band:{name:'Band shoulder rotation',d:'2 sets of 12',q:'band external rotation shoulder'},
 bridge:{name:'Glute bridge',d:'3 sets of 10',q:'glute bridge form'},
 dead:{name:'Dead bug',d:'3 sets of 8 each side',q:'dead bug exercise'}
};
var SESS={
 heavy:{title:'Heavy lower body',min:40,tag:'Strength',ex:['prep','bsq','cdl','calf']},
 plyo:{title:'Plyo day',sub:'Jumps and sprints',min:40,tag:'Jumps',ex:['prep','wsj','ktj','appr','sprint','pogo','sls']},
 plyoL:{title:'Short plyo day',sub:'Shorter because the week is busy',min:20,tag:'Jumps',ex:['prep','sprint','appr']},
 upper:{title:'Upper body and core',min:35,tag:'Strength',ex:['prep','pu','row','ohp','plank','band']},
 lite:{title:'Low-impact day',sub:'No jumping or heavy lifting this week',min:20,tag:'Recovery',ex:['prep','bridge','dead','plank']}
};
var CHECKABLE=['bsq','appr','wsj'];
var STATUS=[['fine','Fine','No pain'],['tired','Tired','Normal soreness'],['achy','Achy','Hurts in a joint'],['sharp','Sharp pain','Stop and rest']];
var AREAS=['Knee','Ankle','Back','Hip','Shoulder','Other'];

/* ---------- state ---------- */
var S;
function def(){return {profile:null,sched:['off','off','prac','off','prac','off','game'],start:null,done:{},checks:[],pain:[],tests:[],hold:{},recheck:{},poll:{},clips:0};}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);return Object.assign(def(),o);}}catch(e){}return def();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
S=load();
var ui={tab:'plan',week:null,draft:null,editDays:false,notice:'',fc:{ex:null,view:'pick',answers:[],last:null},pain:{status:null,where:[],effort:null},err:'',confirmReset:false,copied:false};
var youUrl=null,refUrls={};

/* ---------- dates ---------- */
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function mid(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);return x;}
function curWeek(){if(!S.start)return 1;var a=mid(new Date()),b=mid(new Date(S.start+'T00:00:00'));var n=Math.floor((a-b)/864e5);return Math.max(1,Math.min(4,Math.floor(n/7)+1));}
function planDone(){if(!S.start)return false;var a=mid(new Date()),b=mid(new Date(S.start+'T00:00:00'));return Math.floor((a-b)/864e5)>=28;}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* ---------- scheduler (draft rules: a coach or physical therapist should review) ---------- */
function buildWeek(sched){
 var t=[null,null,null,null,null,null,null],placed={},notes=[];
 var m=function(d){return ((d%7)+7)%7;};
 var game=function(d){return sched[m(d)]==='game';};
 var prac=function(d){return sched[m(d)]==='prac';};
 var pref={heavy:0,plyo:3,upper:5};
 var adj=function(a,b){var x=Math.abs(a-b);return x===1||x===6;};
 ['heavy','plyo','upper'].forEach(function(kind){
  var best=null;
  for(var d=0;d<7;d++){
   if(game(d)||t[d]!==null)continue;
   var ahead=kind==='upper'?0:2,bad=false;
   for(var i=1;i<=ahead;i++){if(game(d+i)){bad=true;}}
   if(bad)continue;
   var dist=Math.min((d-pref[kind]+7)%7,(pref[kind]-d+7)%7);
   var c=dist;
   if(prac(d))c+=kind==='upper'?2:4;
   if(kind==='plyo'&&placed.heavy!==undefined&&adj(d,placed.heavy))c+=6;
   if(kind==='heavy'&&placed.plyo!==undefined&&adj(d,placed.plyo))c+=6;
   if(kind==='heavy'&&game(d-1))c+=1;
   if(!best||c<best.c||(c===best.c&&dist<best.dist))best={d:d,c:c,dist:dist};
  }
  if(best){t[best.d]=kind;placed[kind]=best.d;}else{notes.push(kind);}
 });
 var pts=0;
 for(var d2=0;d2<7;d2++){
  if(sched[d2]==='game')pts+=2;
  if(sched[d2]==='prac')pts+=1;
  if(t[d2]==='heavy')pts+=1.5;
  if(t[d2]==='plyo')pts+=1;
  if(t[d2]==='upper')pts+=0.75;
 }
 var level=pts<6?'Light':(pts<=8.5?'Moderate':'High');
 return {t:t,notes:notes,pts:pts,level:level};
}
function kindFor(dow,week,isCurrent){
 var w=buildWeek(S.sched),k=w.t[dow];
 if(k==='plyo'&&w.level==='High')k='plyoL';
 if(isCurrent&&k){
  var date=ymd(addDays(mid(new Date()),dow-new Date().getDay()));
  if((k==='plyo'||k==='plyoL')&&S.hold.plyo&&date<=S.hold.plyo)k='lite';
  if(k==='heavy'&&S.hold.heavy&&date<=S.hold.heavy)k='lite';
 }
 return k;
}
function exText(id,week){var e=EX[id];if(e.sets)return e.sets[week-1]+' sets '+e.d;return e.d;}

/* ---------- views ---------- */
function head(title,sub,eyebrow){return (eyebrow?'<div class="eyebrow">'+esc(eyebrow)+'</div>':'')+'<h1>'+esc(title)+'</h1>'+(sub?'<p class="sub">'+esc(sub)+'</p>':'');}
function dayGrid(sched){return '<div class="days">'+sched.map(function(s,i){return '<button type="button" class="day '+s+'" data-act="cycle" data-i="'+i+'" aria-label="'+FULL[i]+': '+(s==='off'?'off':s==='prac'?'practice':'game')+'">'+DAYS[i].slice(0,2)+'<small>'+(s==='off'?'off':s==='prac'?'prac':'game')+'</small></button>';}).join('')+'</div>';}
function chips(list,sel,act){return '<div class="chips">'+list.map(function(x){return '<button type="button" class="chip" data-act="'+act+'" data-v="'+esc(x)+'" aria-pressed="'+(sel.indexOf(x)>-1)+'">'+esc(x)+'</button>';}).join('')+'</div>';}
function seg(list,sel,act,cols,extra){return '<div class="seg '+(extra||'')+'" style="grid-template-columns:repeat('+cols+',minmax(0,1fr))" role="group">'+list.map(function(x){return '<button type="button" data-act="'+act+'" data-v="'+esc(x)+'" aria-pressed="'+(sel===x)+'">'+esc(x)+'</button>';}).join('')+'</div>';}

function viewIntake(){
 var d=ui.draft;var minor=d.age!==''&&Number(d.age)<18;
 return '<div class="stack">'+head('Set up your plan','Free, strength-first, built around your games.')+
 '<fieldset><legend>Your sport</legend>'+chips(['Volleyball','Basketball','Other'],[d.sport],'sport')+'</fieldset>'+
 '<div style="display:flex;gap:16px;align-items:flex-end"><div><label class="lbl" for="age" style="display:block">Your age</label><input id="age" type="number" inputmode="numeric" min="10" max="99" placeholder="e.g. 16" value="'+esc(d.age)+'"></div><div class="small" style="flex:1">Under 18? A parent or guardian approves before you start.</div></div>'+
 (minor?'<label class="card" style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" id="consent" '+(d.consent?'checked':'')+' style="width:24px;height:24px;flex:none;margin-top:2px"><span>A parent or guardian knows I am using this app and says it is OK.</span></label>':'')+
 '<fieldset><legend>Lifting experience</legend>'+seg(['Beginner','Some lifting','Experienced'],d.exp,'exp',3)+'</fieldset>'+
 '<fieldset><legend>Anything sore right now?</legend>'+chips(['Nothing'].concat(AREAS),d.sore,'sore')+'</fieldset>'+
 '<fieldset><legend>Teams you play on</legend>'+chips(['School','Club','Rec or other'],d.teams,'team')+'</fieldset>'+
 '<fieldset><legend>Games and practices, all teams</legend><div class="small" style="margin-bottom:8px">Tap a day to cycle: off, practice, game. Count every team.</div>'+dayGrid(d.sched)+'</fieldset>'+
 (ui.err?'<div class="err" role="alert">'+esc(ui.err)+'</div>':'')+
 '<button type="button" class="btn" data-act="start">Build my 4-week plan</button>'+
 '<p class="small">Your plan and clips stay on this phone. Clips are never uploaded.</p></div>';
}

function viewPlan(){
 var cw=curWeek(),w=ui.week||cw,isC=(w===cw);
 var bw=buildWeek(S.sched),today=new Date().getDay();
 var rows=DAYS.map(function(dn,i){
  var k=kindFor(i,w,isC),sd=S.sched[i],cls='row'+(isC&&i===today?' today':'');
  if(sd==='game')return '<div class="'+cls+' game"><div class="d">'+dn+'</div><div class="t"><b>Game</b></div></div>';
  if(k){var m=SESS[k];return '<div class="'+cls+'"><div class="d">'+dn+'</div><div class="t"><b>'+esc(m.title)+'</b><span>'+m.min+' min'+(sd==='prac'?' · plus practice':'')+(m.sub?' · '+esc(m.sub):'')+(isC&&i===today?' · today':'')+'</span></div><div class="tag">'+m.tag+'</div></div>';}
  if(sd==='prac')return '<div class="'+cls+' prac"><div class="d">'+dn+'</div><div class="t"><b>Practice</b><span>From your schedule</span></div></div>';
  return '<div class="'+cls+' mute"><div class="d">'+dn+'</div><div class="t"><b>Rest</b></div></div>';
 }).join('');
 var games=[];S.sched.forEach(function(s,i){if(s==='game')games.push(FULL[i]);});
 var note=games.length?'<b>Auto-adjusted for your '+games.join(' and ')+' game'+(games.length>1?'s':'')+'.</b> Heavy legs and jumps stay out of the 2 days before. Change your game or practice days and the week re-sorts.':'<b>No game set.</b> Sessions use the standard week. Add your game days and the week re-sorts around them.';

  var fl2=flags.map(function(x){var q=qs.filter(function(z){return z.flag===x.flag;})[0];return {flag:x.flag,short:x.flag,label:{knee:'Knees caved',heel:'Heels came up',chest:'Chest dropped',loud:'Landing was loud',uneven:'Feet landed unevenly'}[x.flag]||q.q};});
  var rec={id:String(Date.now()),ex:f.ex,date:ymd(new Date()),flags:fl2,answers:f.answers.slice()};
  S.checks.push(rec);S.clips=(S.clips||0)+1;
  f.last={flags:fl2,good:good.map(function(g){return g.charAt(0).toUpperCase()+g.slice(1);})};f.view='result';save();render();window.scrollTo(0,0);return;
 }
 if(a==='recheck'){if(S.recheck[f.ex])delete S.recheck[f.ex];else S.recheck[f.ex]=ymd(addDays(new Date(),3));save();render();return;}
 if(a==='auto'){S.poll.auto=v;save();render();return;}
 if(a==='waitlist'){S.poll.waitlist=!S.poll.waitlist;save();render();return;}
 if(a==='fcdone'){ui.fc={ex:null,view:'pick',answers:[],last:null};go('progress');return;}
 if(a==='copy'){var txt=summary();var done=function(){ui.copied=true;render();setTimeout(function(){ui.copied=false;render();},1800);};try{navigator.clipboard.writeText(txt).then(done,function(){window.prompt&&0;fallbackCopy(txt);done();});}catch(e){fallbackCopy(txt);done();}return;}
 if(a==='status'){ui.pain.status=v;render();return;}
 if(a==='where'){ui.pain.where=toggle(ui.pain.where,v,null);render();return;}
 if(a==='effort'){ui.pain.effort=v;render();return;}
 if(a==='savepain'){
  var p=ui.pain;S.pain.push({date:ymd(new Date()),status:p.status,where:p.where.slice(),effort:Number(p.effort)});
  var until=ymd(addDays(new Date(),6));
  if(p.status==='achy'||p.status==='sharp'){S.hold.plyo=until;}
  if(p.status==='sharp'){S.hold.heavy=until;}
  save();ui.notice=p.status==='sharp'?'Saved. Jumping and heavy lifting are out for the next week. Talk to a coach, parent or doctor.':p.status==='achy'?'Saved. Jumping is low-impact for the next week.':'Saved. See you next session.';go('plan');return;
 }
 if(a==='logtest'){var el=document.getElementById('vt'),n=parseFloat(el.value);if(!n||n<1||n>60)return;S.tests.push({date:ymd(new Date()),in:n});save();render();return;}
 if(a==='reset'){if(!ui.confirmReset){ui.confirmReset=true;render();return;}try{localStorage.removeItem(KEY);}catch(e){}S=def();ui.draft=newDraft();ui.confirmReset=false;ui.tab='plan';ui.week=null;render();window.scrollTo(0,0);return;}
});
function fallbackCopy(t){var x=document.createElement('textarea');x.value=t;x.style.position='fixed';x.style.opacity='0';document.body.appendChild(x);x.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(x);}
document.addEventListener('change',function(ev){
 var t=ev.target;
 if(t.id==='age'){var was=ui.draft.age!==''&&Number(ui.draft.age)<18;ui.draft.age=t.value;var now=t.value!==''&&Number(t.value)<18;if(was!==now)render();return;}
 if(t.id==='consent'){ui.draft.consent=t.checked;return;}
 if(t.getAttribute&&t.getAttribute('data-act')==='toggleex'){
  var key=ymd(new Date());if(!ui.todayEx||ui.todayEx.key!==key)ui.todayEx={key:key,list:[]};
  var id=t.getAttribute('data-v'),l=ui.todayEx.list,ix=l.indexOf(id);if(t.checked&&ix<0)l.push(id);if(!t.checked&&ix>-1)l.splice(ix,1);return;
 }
 if(t.id==='clip'||t.id==='clip2'){var file=t.files&&t.files[0];if(!file)return;if(youUrl)URL.revokeObjectURL(youUrl);youUrl=URL.createObjectURL(file);S.clips=S.clips||0;ui.fc.view='compare';ui.fc.answers=[];render();window.scrollTo(0,0);return;}
 if(t.id==='refIn'){var rf=t.files&&t.files[0];if(!rf)return;if(refUrls[ui.fc.ex])URL.revokeObjectURL(refUrls[ui.fc.ex]);refUrls[ui.fc.ex]=URL.createObjectURL(rf);render();return;}
});
document.addEventListener('input',function(ev){if(ev.target.id==='age')ui.draft.age=ev.target.value;});
function newDraft(){return {sport:'Volleyball',age:'',consent:false,exp:'Beginner',teams:['School'],sore:['Nothing'],sched:['off','off','prac','off','prac','off','game']};}
ui.draft=newDraft();
render();
})();
</script>
